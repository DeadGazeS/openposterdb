services:
  openposterdb:
    image: pnrxa/openposterdb:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - openposterdb-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/auth/status"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  openposterdb-data:
