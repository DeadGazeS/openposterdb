services:
  openposterdb:
    image: ghcr.io/deadgazes/openposterdb
    container_name: openposterdb
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - openposterdb-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/auth/status"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  openposterdb-data:
